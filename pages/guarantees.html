<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="Consulta y organiza todas tus garantías en GarantyApp.">
    <title>Mis garantías | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_guarantees.css">
    <link rel="stylesheet" href="../css/styles_tokens.css">
    <link rel="stylesheet" href="../css/styles_account_menu.css">
    <script src="../js/config.js"></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/user.js" defer></script>
    <script src="../js/category-icons.js" defer></script>
    <script src="../js/guarantee-filter.js" defer></script>
    <script src="../js/guarantee-list.js" defer></script>
  </head>
  <body class="guarantees-page" data-status="">
    <header class="guarantees-header">
      <a class="guarantees-brand" href="dashboard.html" aria-label="GarantyApp, inicio"><img src="../assets/garantyapp-logo.png" alt="GarantyApp"><span><strong>Mis garantías</strong><small>Controla tus productos</small></span></a>
      <div class="guarantees-header-actions">
        <a class="add-guarantee" href="dashboard.html"><span aria-hidden="true">+</span> Añadir garantía</a>
        <details class="account-menu">
          <summary class="account-menu-trigger" data-user-label="Perfil de" aria-label="Perfil">
            <span class="account-avatar" data-user-initials>…</span><span class="account-name" data-user-name>Cargando…</span>
            <img src="../assets/figma-chevron-down.svg" alt="" aria-hidden="true">
          </summary>
          <div class="account-menu-panel">
            <a href="dashboard.html">Inicio</a>
            <a href="settings.html">Configuración</a>
            <a href="index.html">Cerrar sesión</a>
          </div>
        </details>
      </div>
    </header>
    <main class="guarantees-main">
      <nav class="guarantee-filters" aria-label="Filtrar garantías">
        <a class="filter-link filter-link--all" href="dashboard.html">Todas <span class="filter-count">0</span></a>
        <a class="filter-link" href="dashboard.html?status=expiring">Por vencer <span class="filter-count">0</span></a>
        <a class="filter-link" href="dashboard.html?status=active">Activas <span class="filter-count">0</span></a>
        <a class="filter-link" href="dashboard.html?status=expired">Vencidas <span class="filter-count">0</span></a>
      </nav>
      <div class="guarantee-controls">
        <label class="guarantee-search">
          <span class="visually-hidden">Buscar garantía</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input type="search" placeholder="Buscar garantía...">
        </label>
        <label class="category-filter">
          <span class="visually-hidden">Filtrar por categoría</span>
          <select id="category-filter">
            <option value="">Todas las categorías</option>
          </select>
        </label>
      </div>
      <section class="guarantee-list guarantee-list--grid" aria-label="Todas las garantías"><p class="guarantee-empty" role="status">Cargando garantías...</p></section>
    </main>
    <nav class="guarantees-nav" aria-label="Navegación principal">
      <a href="dashboard.html"><span aria-hidden="true">⌂</span>Inicio</a>
      <a class="guarantees-nav-active" href="dashboard.html"><span aria-hidden="true">▤</span>Mis garantías</a>
      <a href="settings.html"><span aria-hidden="true">⚙</span>Configuración</a>
      <a class="guarantees-logout" href="index.html"><span aria-hidden="true">↪</span>Cerrar sesión</a>
    </nav>
  </body>
</html>

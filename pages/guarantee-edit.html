<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="Edita los datos de una garantía en GarantyApp.">
    <title>Editar garantía | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_tokens.css">
    <link rel="stylesheet" href="../css/styles_guarantee_record.css">
    <link rel="stylesheet" href="../css/styles_guarantee_edit.css">
    <script src="../js/guarantee-records.js" defer></script>
    <script src="../js/guarantee-edit.js" defer></script>
  </head>
  <body class="record-page record-page--edit">
    <header class="record-header">
      <a class="record-brand" href="dashboard.html" aria-label="GarantyApp, inicio"><img src="../assets/garantyapp-logo.png" alt="GarantyApp"></a>
      <span class="record-header-title">Editar garantía</span>
      <span class="record-header-spacer" aria-hidden="true"></span>
    </header>
    <main class="record-main edit-main">
      <p class="record-unavailable" id="edit-unavailable" role="alert" hidden>No encontramos esta garantía. <a href="guarantees.html">Volver a mis garantías</a>.</p>
      <form class="record-form" id="guarantee-edit-form">
        <section class="record-hero edit-hero" aria-labelledby="edit-title">
          <span class="record-product-icon" aria-hidden="true">▣</span>
          <div class="record-hero-copy"><p class="record-eyebrow">Mis garantías</p><h1 id="edit-title">Actualizar información</h1><p>Modifica los datos de tu producto y su garantía.</p></div>
        </section>
        <section class="record-panel" aria-labelledby="product-fields-heading">
          <div class="record-panel-heading"><span class="record-section-icon" aria-hidden="true">▣</span><h2 id="product-fields-heading">Información del producto</h2></div>
          <div class="edit-fields">
            <label class="record-field record-field--wide">Nombre del producto<input name="product" type="text" maxlength="80" required></label>
            <label class="record-field">Marca<input name="brand" type="text" maxlength="60" required></label>
            <label class="record-field">Categoría<input name="category" type="text" maxlength="50" required></label>
            <label class="record-field">Número de serie<input name="serial" type="text" maxlength="60"></label>
          </div>
        </section>
        <section class="record-panel" aria-labelledby="purchase-fields-heading">
          <div class="record-panel-heading"><span class="record-section-icon" aria-hidden="true">⌑</span><h2 id="purchase-fields-heading">Compra y garantía</h2></div>
          <div class="edit-fields">
            <label class="record-field">Fecha de compra<input name="purchased" type="date" required></label>
            <label class="record-field">Fecha de vencimiento<input name="expires" type="date" required></label>
            <label class="record-field">Precio de compra (COP)<input name="price" type="number" min="0" step="1" required></label>
            <label class="record-field">Duración<input name="duration" type="text" maxlength="30" required></label>
            <label class="record-field record-field--wide">Tienda<input name="store" type="text" maxlength="80"></label>
          </div>
        </section>
        <section class="record-panel" aria-labelledby="notes-fields-heading">
          <div class="record-panel-heading"><span class="record-section-icon" aria-hidden="true">☰</span><h2 id="notes-fields-heading">Observaciones</h2></div>
          <label class="record-field">Notas<textarea name="notes" rows="3" maxlength="500" placeholder="Añade información útil sobre tu garantía"></textarea></label>
        </section>
        <p class="record-feedback" id="edit-feedback" role="alert"></p>
        <div class="record-actions">
          <a class="record-button record-button--secondary" id="edit-cancel-link" href="guarantees.html">Cancelar</a>
          <button class="record-button record-button--primary" type="submit">Guardar cambios</button>
        </div>
      </form>
    </main>
    <nav class="dashboard-nav" aria-label="Navegación principal">
      <a class="nav-link" href="dashboard.html"><span aria-hidden="true">⌂</span>Inicio</a>
      <a class="nav-link nav-link--active" href="guarantees.html"><span aria-hidden="true">▤</span>Mis garantías</a>
      <a class="nav-link" href="settings.html"><span aria-hidden="true">⚙</span>Configuración</a>
      <a class="nav-link nav-link--logout" href="login.html"><span aria-hidden="true">↪</span>Cerrar sesión</a>
    </nav>
  </body>
</html>

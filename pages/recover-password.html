<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <title>Recuperar contraseña | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_landing.css">
  </head>
  <body class="recover-page">
    <main class="recover-layout">
      <a class="recover-brand" href="index.html" aria-label="GarantyApp, inicio">
        <img src="../assets/garantyapp-logo.png" alt="GarantyApp">
      </a>
      <section class="recover-card" aria-labelledby="recover-title">
        <header class="auth-card-heading">
          <h1 id="recover-title">Recuperar contraseña</h1>
          <p>Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        </header>
        <form class="recover-form" action="#" method="get">
          <label class="auth-input-wrap">
            <img src="../assets/auth-mail.svg" alt="" aria-hidden="true">
            <input type="email" name="email" placeholder="tu@email.com" autocomplete="email" aria-label="Correo electrónico" required>
          </label>
          <button class="auth-submit" type="submit">Enviar enlace de recuperación</button>
        </form>
        <a class="recover-back" href="login.html">
          <img src="../assets/recover-back.svg" alt="">
          <span>Volver al inicio de sesión</span>
        </a>
      </section>
    </main>
  </body>
</html>

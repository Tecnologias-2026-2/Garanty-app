<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="Consulta tus garantías próximas a vencer en GarantyApp.">
    <title>Garantías por vencer | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_dashboard.css">
    <link rel="stylesheet" href="../css/styles_tokens.css">
    <script src="../js/config.js"></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/category-icons.js" defer></script>
    <script src="../js/user.js" defer></script>
  </head>
  <body class="dashboard-page" data-status="expiring">
    <header class="dashboard-header">
      <div class="dashboard-header-inner">
        <a class="dashboard-brand" href="dashboard.html" aria-label="GarantyApp, inicio"><img src="../assets/garantyapp-logo.png" alt="GarantyApp"></a>
        <label class="dashboard-search">
          <span class="visually-hidden">Buscar garantías</span>
          <img src="../assets/figma-search.svg" alt="" aria-hidden="true">
          <input type="search" placeholder="Buscar garantía...">
        </label>
        <div class="dashboard-user">
          <details class="dashboard-user-menu">
            <summary class="user-link" data-user-label="Perfil de" aria-label="Perfil">
              <span class="user-avatar" data-user-initials>…</span>
              <span class="user-name" data-user-name>Cargando…</span>
              <img class="user-chevron" src="../assets/figma-chevron-down.svg" alt="" aria-hidden="true">
            </summary>
            <div class="user-menu-panel">
              <a href="settings.html">Configuración</a>
              <a href="index.html">Cerrar sesión</a>
            </div>
          </details>
        </div>
      </div>
    </header>
    <main class="dashboard-main">
      <section class="welcome-block">
        <h1>Buen día, <span id="welcome-name">...</span> <span aria-hidden="true">👋</span></h1>
        <p>Cargando tus garantías...</p>
      </section>
      <section class="summary-grid" aria-label="Resumen de garantías">
        <a class="summary-card summary-card--active" href="dashboard.html?status=active">
          <span><span class="summary-label">Garantías activas</span><strong>0</strong><span class="summary-link">Ver listado</span></span>
          <span class="summary-icon" aria-hidden="true"><img src="../assets/figma-summary-active.svg" alt=""></span>
        </a>
        <a class="summary-card summary-card--expiring" href="dashboard.html?status=expiring">
          <span><span class="summary-label">Garantías por vencer</span><strong>0</strong><span class="summary-link">Ver listado</span></span>
          <span class="summary-icon" aria-hidden="true"><img src="../assets/figma-summary-expiring.svg" alt=""></span>
        </a>
        <a class="summary-card summary-card--expired" href="dashboard.html?status=expired">
          <span><span class="summary-label">Garantías vencidas</span><strong>0</strong><span class="summary-link">Ver listado</span></span>
          <span class="summary-icon" aria-hidden="true"><img src="../assets/figma-summary-expired.svg" alt=""></span>
        </a>
      </section>
      <section class="recent-section" aria-labelledby="recent-title">
        <h2 id="recent-title"><a class="recent-title-link" href="dashboard.html">Garantías recientes</a></h2>
        <div class="product-grid"><p class="product-empty" role="status">Cargando garantías...</p></div>
      </section>
      <a class="add-product" href="add-guarantee.html" aria-label="Añadir garantía">
        <img src="../assets/figma-add.svg" alt="" aria-hidden="true">
      </a>
    </main>
  </body>
</html>

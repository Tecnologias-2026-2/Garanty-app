<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="Administra los datos de tu perfil de GarantyApp.">
    <title>Configuración | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles_settings.css">
    <link rel="stylesheet" href="/css/styles_tokens.css">
      <script src="/js/api.js" defer></script>
    <script src="/js/user.js" defer></script>
  </head>
  <body class="settings-page">
    <header class="settings-header">
      <a class="settings-brand" href="/dashboard" aria-label="GarantyApp, inicio"><img src="/assets/garantyapp-logo.png" alt="GarantyApp"></a>
      <div class="settings-user"><span data-user-initials>…</span><span data-user-name>Cargando…</span></div>
    </header>
    <div class="settings-shell">
      <main class="settings-main">
        <h1>Tu Perfil</h1>
        <section class="profile-card" aria-label="Información del perfil">
          <div class="profile-photo-row">
            <span class="profile-avatar" aria-hidden="true"></span>
            <span class="profile-prompt">Subir una foto para tu perfil</span>
            <a href="#" aria-disabled="true">Subir foto <span aria-hidden="true">›</span></a>
          </div>
          <div class="profile-info-row">
            <div><h2>Nombre</h2><p id="profile-name">...</p></div>
            <a href="#" data-edit="name">Editar <span aria-hidden="true">›</span></a>
          </div>
          <div class="profile-info-row">
            <div><h2>Correo electrónico</h2><p id="profile-email">...</p></div>
            <a href="#" data-edit="email">Editar <span aria-hidden="true">›</span></a>
          </div>
        </section>
      </main>
      <nav class="settings-nav" aria-label="Navegación principal">
        <a href="/dashboard"><span aria-hidden="true">⌂</span>Inicio</a>
        <a href="/guarantees"><span aria-hidden="true">▤</span>Mis garantías</a>
        <a class="settings-nav-active" href="/settings"><span aria-hidden="true">⚙</span>Configuración</a>
        <a class="settings-logout" href="/login"><span aria-hidden="true">↪</span>Cerrar sesión</a>
      </nav>
    </div>
  </body>
</html>

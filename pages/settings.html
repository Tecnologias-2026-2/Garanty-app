<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="Administra los datos de tu perfil de GarantyApp.">
    <title>Configuración | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_settings.css">
    <link rel="stylesheet" href="../css/styles_tokens.css">
    <link rel="stylesheet" href="../css/styles_account_menu.css">
      <script src="../js/config.js"></script>
      <script src="../js/api.js" defer></script>
    <script src="../js/user.js" defer></script>
  </head>
  <body class="settings-page">
    <header class="settings-header">
      <a class="settings-brand" href="dashboard.html" aria-label="GarantyApp, inicio"><img src="../assets/garantyapp-logo.png" alt="GarantyApp"></a>
      <details class="account-menu settings-user">
        <summary class="account-menu-trigger" data-user-label="Perfil de" aria-label="Perfil">
          <span class="account-avatar" data-user-initials>…</span><span class="account-name" data-user-name>Cargando…</span>
          <img src="../assets/figma-chevron-down.svg" alt="" aria-hidden="true">
        </summary>
        <div class="account-menu-panel">
          <a href="dashboard.html">Inicio</a>
          <a href="settings.html">Configuración</a>
          <a href="index.html">Cerrar sesión</a>
        </div>
      </details>
    </header>
    <div class="settings-shell">
      <main class="settings-main">
        <h1>Tu Perfil</h1>
        <section class="profile-card" aria-label="Información del perfil">
          <div class="profile-photo-row">
            <span class="profile-avatar" aria-hidden="true"></span>
            <span class="profile-prompt">Subir una foto para tu perfil</span>
            <a href="#" aria-disabled="true">Subir foto <span aria-hidden="true">›</span></a>
          </div>
          <div class="profile-info-row">
            <div><h2>Nombre</h2><p id="profile-name">...</p></div>
            <a href="#" data-edit="name">Editar <span aria-hidden="true">›</span></a>
          </div>
          <div class="profile-info-row">
            <div><h2>Correo electrónico</h2><p id="profile-email">...</p></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>

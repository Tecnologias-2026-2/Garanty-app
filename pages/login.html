<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <title>Iniciar sesión | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_landing.css">
    <link rel="stylesheet" href="../css/styles_tokens.css">
  </head>
  <body class="auth-page">
    <main class="auth-layout auth-layout--login">
      <section class="auth-main" aria-labelledby="login-title">
        <a class="auth-brand" href="index.html" aria-label="GarantyApp, inicio">
          <img src="../assets/garantyapp-logo.png" alt="GarantyApp">
        </a>
        <form class="auth-card login-card" id="login-form" novalidate>
          <header class="auth-card-heading">
            <h1 id="login-title">Bienvenido de nuevo</h1>
            <p>Ingresa a tu cuenta para gestionar tus garantías.</p>
          </header>
          <div class="auth-fields">
            <label class="auth-field">
  <span>Correo electrónico</span>

  <span class="auth-input-wrap">
    <img src="../assets/auth-mail.svg" alt="" aria-hidden="true">

    <input
      id="login-email"
      type="email"
      name="email"
      placeholder="tu@email.com"
      autocomplete="email"
      aria-describedby="email-message"
      required
    >

    <span class="field-status" aria-hidden="true"></span>
  </span>

  <span
    class="field-message"
    id="email-message"
    aria-live="polite"
  ></span>
</label>
            <div class="auth-field">
  <span class="auth-field-label">
    <label for="login-password">Contraseña</label>
    <a href="recover-password.html">¿Olvidaste tu contraseña?</a>
  </span>

  <span class="auth-input-wrap">
    <img src="../assets/auth-lock.svg" alt="" aria-hidden="true">

    <input
      id="login-password"
      type="password"
      name="password"
      placeholder="••••••••"
      autocomplete="current-password"
      aria-describedby="password-message"
      required
      minlength="6"
    >

    <button
      class="password-toggle"
      type="button"
      aria-label="Mostrar contraseña"
      aria-pressed="false"
    >
      <img src="../assets/auth-eye.svg" alt="" aria-hidden="true">
    </button>

    <span class="field-status" aria-hidden="true"></span>
  </span>

  <span
    class="field-message"
    id="password-message"
    aria-live="polite"
  ></span>
</div>
          </div>
          <label class="remember-option">
            <input type="checkbox" name="remember">
            <span>Recordarme</span>
          </label>
          <div class="auth-actions">
            <button type="submit" class="auth-submit">
  Iniciar sesión
</button>
            <div class="auth-divider"><span></span><span>o</span><span></span></div>
            <button
  type="button"
  class="auth-google"
  id="google-login"
>
  Continuar con Google
</button>
          </div>
          <p class="auth-switch">¿No tienes una cuenta? <a href="register.html">Crear cuenta</a></p>
        </form>
      </section>


       </main>

    <script src="../js/login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b0a3d">
    <meta name="description" content="El pago de demostración no pudo completarse en GarantyApp.">
    <title>Pago fallido | GarantyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles_payment_failed.css">
  </head>
  <body>
    <header class="status-header">
      <a href="index.html#inicio" aria-label="GarantyApp, inicio">
        <img src="../assets/garantyapp-logo.png" alt="GarantyApp">
      </a>
    </header>
    <main class="status-main">
      <section class="status-content" aria-labelledby="status-title">
        <span class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path d="M24 5 44 41H4L24 5Z"></path>
            <path d="M24 17v11"></path>
            <circle cx="24" cy="34" r="1"></circle>
          </svg>
        </span>
        <h1 id="status-title">¡Pago Fallido!</h1>
        <p>Algo salió mal, no pudimos registrar tu pago.<br>¡Inténtalo de nuevo!</p>
        <a class="status-button" href="index.html#planes">Volver</a>
        <p class="demo-caption">Estado de demostración: no se realizó ningún cobro.</p>
      </section>
    </main>
  </body>
</html>
